buildscript {
  repositories {
    google()
    jcenter()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:4.0.2'
  }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  compileSdkVersion 35 // Updated to match the project compileSdkVersion
  defaultConfig {
    minSdkVersion 24 // Match the main project's minSdkVersion
    targetSdkVersion 34 // Match the main project's targetSdkVersion
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17 // Align with the JDK version (17)
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenLocal()
  maven {
    url("$rootDir/../node_modules/react-native/android")
  }
  google()
  jcenter()
}

dependencies {
  implementation 'com.facebook.react:react-native:+' // From node_modules
  implementation 'com.microsoft.identity.client:msal:2.2.+'
}
